name: release

# Build the orchestrator stack (service / orchd / orchctl / artifactd, + orchweb best-effort) for every
# shipped OS/arch and publish them to a GitHub Release. Targets: macOS arm64, Linux {x86_64, arm64},
# Windows x86_64. (macOS Intel and Windows arm64 are NOT shipped -- native arm64-Windows zig build is an
# upstream Zig crash; see lang/CLAUDE.md.)
#
# The orchestrator is NOVA code, so this lives in its OWN workflow (not the lang release): it needs a
# built `nova` on PATH, which means checking out the lang toolchain and building it (with LLVM) first,
# exactly as ci.yml does. Keeping it separate keeps the lang release simple and lets the orchestrator cut
# its own releases on its own tags.
#
# Two runners cover all four bundles, because nova cross-compiles APPLICATIONS from any host (only
# building nova ITSELF for a target needs that target's LLVM):
#   * build-cross (Linux x86_64 host): `build.sh --target <triple>` for the three linux/windows targets.
#     These four are the link-verified cross targets (see lang/CLAUDE.md). Windows produces real .exe.
#   * build-macos (macos-14, arm64): a native build (macOS cannot be cross-produced from a non-mac host).
#
# NOTE: the runtime FUNCTIONALITY on Windows is best-effort -- the fd-handoff data plane (service/orchd)
# is POSIX-only by design (SCM_RIGHTS; the Windows sendFd/recvFd are stubs). These bundles BUILD for
# Windows; running the handoff path there needs the WSADuplicateSocket port (see CLAUDE.md). orchctl
# (offline CLI) and artifactd (HTTP) do not use the handoff.
#
# TRIGGER: tag `v*` (or run manually). The tag must be on a branch that carries THIS workflow file and
# build.sh -- currently `orchestrator-production-design`, not the default `main`.
#
# Monorepo layout is reconstructed by checking out three repos into fixed paths (as in ci.yml):
#   lang/  <- kamlesh-nb/nova   packages/nova-orchestrator/ <- this repo   packages/nova-novadb/ <- driver
# If those repos are private, set NOVA_TOKEN to a PAT with read access (falls back to GITHUB_TOKEN).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0); names the archives"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  NOVA_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-cross:
    # One Linux x86_64 host cross-compiles the three linux/windows bundles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: packages/nova-orchestrator }
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova
          path: lang
          token: ${{ secrets.NOVA_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova-novadb
          path: packages/nova-novadb
          token: ${{ secrets.NOVA_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (apt) + point the build at it
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21-dev libclang-21-dev clang-21 zlib1g-dev libzstd-dev libxml2-dev liblzma-dev
          sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
          echo "NOVA_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          /usr/lib/llvm-21/bin/llvm-config --version
      # ReleaseFast: a Debug nova's leak gate exits 1 on every build. Installs `nova` to ~/.nova/bin.
      - name: Build the Nova toolchain (ReleaseFast)
        working-directory: lang
        run: zig build -Doptimize=ReleaseFast
      - name: Cross-build the orchestrator for the linux/windows targets
        working-directory: packages/nova-orchestrator
        run: |
          export PATH="$HOME/.nova/bin:$PATH"
          for t in linux-x86_64 linux-arm64 windows-x86_64; do
            echo "== building orchestrator for $t =="
            ./build.sh --release --target "$t"
          done
      - name: Package the three bundles
        working-directory: packages/nova-orchestrator
        run: |
          root="$PWD"; mkdir -p out
          for t in linux-x86_64 linux-arm64 windows-x86_64; do
            d="build/release/$t/bin"; if [ ! -d "$d" ]; then echo "missing $d"; exit 1; fi
            base="nova-orchestrator-${NOVA_VERSION}-${t}"
            case "$t" in
              windows-*) ( cd "$d" && zip -q -r "$root/out/${base}.zip" . )
                         ( cd out && sha256sum "${base}.zip" > "${base}.zip.sha256" ) ;;
              *)         tar -C "$d" -czf "out/${base}.tar.gz" .
                         ( cd out && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256" ) ;;
            esac
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: orch-cross
          path: |
            packages/nova-orchestrator/out/*.tar.gz
            packages/nova-orchestrator/out/*.tar.gz.sha256
            packages/nova-orchestrator/out/*.zip
            packages/nova-orchestrator/out/*.zip.sha256

  build-macos:
    # Apple Silicon, native (macOS cannot be cross-produced from a non-mac host). Intel not shipped.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: packages/nova-orchestrator }
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova
          path: lang
          token: ${{ secrets.NOVA_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova-novadb
          path: packages/nova-novadb
          token: ${{ secrets.NOVA_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Install LLVM 21 (Homebrew) + point the build at it
        run: |
          brew install llvm@21 || brew install llvm
          echo "NOVA_LLVM_PREFIX=$(brew --prefix llvm@21 2>/dev/null || brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Build the Nova toolchain (ReleaseFast)
        working-directory: lang
        run: zig build -Doptimize=ReleaseFast
      - name: Build the orchestrator (native arm64)
        working-directory: packages/nova-orchestrator
        run: |
          export PATH="$HOME/.nova/bin:$PATH"
          ./build.sh --release
      - name: Package the macOS arm64 bundle
        working-directory: packages/nova-orchestrator
        run: |
          mkdir -p out; d="build/release/bin"; if [ ! -d "$d" ]; then echo "missing $d"; exit 1; fi
          base="nova-orchestrator-${NOVA_VERSION}-macos-arm64"
          tar -C "$d" -czf "out/${base}.tar.gz" .
          ( cd out && shasum -a 256 "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: orch-macos-arm64
          path: |
            packages/nova-orchestrator/out/*.tar.gz
            packages/nova-orchestrator/out/*.tar.gz.sha256

  # Publish a GitHub Release ONLY on a real version tag. A manual workflow_dispatch run just builds and
  # uploads the bundles as workflow artifacts; it does not cut a release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-cross, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Collect + checksums
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} out/ \;
          ( cd out && sha256sum nova-orchestrator-*.tar.gz nova-orchestrator-*.zip 2>/dev/null > SHA256SUMS.txt || true )
          ls -la out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOVA_VERSION }}
          name: Nova orchestrator ${{ env.NOVA_VERSION }}
          generate_release_notes: true
          files: |
            out/nova-orchestrator-*.tar.gz
            out/nova-orchestrator-*.tar.gz.sha256
            out/nova-orchestrator-*.zip
            out/nova-orchestrator-*.zip.sha256
            out/SHA256SUMS.txt
