name: release

# Build the orchestrator stack (service / kynatord / kynatorctl / artifactd, + orchweb best-effort) and publish
# it to a GitHub Release. Targets: Linux {x86_64, arm64}.
#
# Modelled on the lang toolchain's release workflow: each bundle is built NATIVELY on a runner of that
# arch. We do NOT cross-compile (`build.sh --target` aborts when cross-building the C++ runtime on the
# CI hosts); native per-runner builds are the proven path, exactly as lang's release does.
#
# The orchestrator is KYTE code, so each runner builds the lang toolchain (with LLVM) first, then runs
# `build.sh --release` for its own host arch.
#
# LINUX ONLY -- same scope as ci.yml. The orchestrator is a Linux/POSIX production concern (its
# fd-handoff data plane is AF_UNIX/SCM_RIGHTS); macOS/Windows are development hosts, not ship targets.
# (A macOS-arm64 leg was tried and aborted at build with exit 134; not chased since macOS is out of the
# orchestrator's production scope. See CLAUDE.md.)
#
# TRIGGER: tag `v*` (or run manually). The tag must be on a branch that carries THIS workflow + build.sh.
#
# Monorepo layout is reconstructed by checking out three repos into fixed paths (as in ci.yml):
#   lang/  <- kamlesh-nb/nova   packages/nova-orchestrator/ <- this repo   packages/nova-novadb/ <- driver
# If those repos are private, set KYTE_TOKEN to a PAT with read access (falls back to GITHUB_TOKEN).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0); names the archives"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  KYTE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with: { path: packages/nova-orchestrator }
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova
          path: lang
          token: ${{ secrets.KYTE_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova-novadb
          path: packages/nova-novadb
          token: ${{ secrets.KYTE_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }

      - name: Install LLVM 21 + point the build at it
        run: |
          if [ "${{ matrix.os }}" = "macos" ]; then
            brew install llvm@21 || brew install llvm
            echo "KYTE_LLVM_PREFIX=$(brew --prefix llvm@21 2>/dev/null || brew --prefix llvm)" >> "$GITHUB_ENV"
          else
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
            sudo apt-get install -y llvm-21-dev libclang-21-dev clang-21 zlib1g-dev libzstd-dev libxml2-dev liblzma-dev
            sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
            echo "KYTE_LLVM_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          fi

      # ReleaseFast: a Debug kyte's leak gate exits 1 on every `kyte build`. Installs `kyte` to ~/.kyte/bin.
      - name: Build the Kyte toolchain (ReleaseFast)
        working-directory: lang
        run: zig build -Doptimize=ReleaseFast

      - name: Build the orchestrator (native)
        working-directory: packages/nova-orchestrator
        run: |
          export PATH="$HOME/.kyte/bin:$PATH"
          ./build.sh --release

      - name: Package the bundle
        working-directory: packages/nova-orchestrator
        run: |
          mkdir -p out
          d="build/release/bin"
          if [ ! -d "$d" ]; then echo "no $d"; exit 1; fi
          base="nova-orchestrator-${KYTE_VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          tar -C "$d" -czf "out/${base}.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then ( cd out && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256" ); \
          else ( cd out && shasum -a 256 "${base}.tar.gz" > "${base}.tar.gz.sha256" ); fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nova-orchestrator-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            packages/nova-orchestrator/out/*.tar.gz
            packages/nova-orchestrator/out/*.tar.gz.sha256

  # Publish a GitHub Release ONLY on a real version tag. A manual workflow_dispatch run just builds and
  # uploads the bundles as workflow artifacts; it does not cut a release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Collect + checksums
        run: |
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} out/ \;
          ( cd out && sha256sum nova-orchestrator-*.tar.gz 2>/dev/null > SHA256SUMS.txt || true )
          ls -la out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KYTE_VERSION }}
          name: Kyte orchestrator ${{ env.KYTE_VERSION }}
          generate_release_notes: true
          files: |
            out/nova-orchestrator-*.tar.gz
            out/nova-orchestrator-*.tar.gz.sha256
            out/SHA256SUMS.txt
